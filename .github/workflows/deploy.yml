name: deploy

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Push
        uses: cake-build/cake-action@v2
        with:
          target: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
