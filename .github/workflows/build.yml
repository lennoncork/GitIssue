name: build

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        uses: cake-build/cake-action@v2
        with:
          target: Build
      - name: Format
        uses: cake-build/cake-action@v2
        with:
          target: Format
      - name: Analyzers
        uses: cake-build/cake-action@v2
        with:
          target: Analyzers
      - name: Validate
        uses: cake-build/cake-action@v2
        with:
          target: Validate
      - name: Test
        uses: cake-build/cake-action@v2
        with:
          target: Test
      - name: Report
        uses: cake-build/cake-action@v2
        with:
          target: Report
